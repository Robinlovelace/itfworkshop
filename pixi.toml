[workspace]
authors = ["robinlovelace <rob00x@gmail.com>"]
channels = ["conda-forge"]
name = "itfworkshop"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
render = "quarto render ukrainian-flows.qmd"
render-all = "quarto render"
start = "quarto preview"

[dependencies]
python = ">=3.14.5,<3.15"
pandas = ">=3.0.3,<4"
geopandas = ">=1.1.3,<2"
plotly = ">=6.8.0,<7"
requests = ">=2.34.2,<3"
nbclient = ">=0.11.0,<0.12"
ipykernel = ">=7.2.0,<8"
pyyaml = ">=6.0.3,<7"
jupyter = ">=1.1.1,<2"
notebook = ">=7.5.7,<8"
