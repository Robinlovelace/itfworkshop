<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#1a1a2e"/>
  <rect x="50" y="80" width="700" height="340" rx="10" fill="#16213e" stroke="#0f3460" stroke-width="2"/>
  <!-- Flow lines representing OD desire lines -->
  <polyline points="100,340 200,300 300,320 400,220 500,270 600,200 700,240" fill="none" stroke="#e94560" stroke-width="3"/>
  <polyline points="100,320 200,270 300,290 400,190 500,240 600,170 700,210" fill="none" stroke="#0f3460" stroke-width="2"/>
  <!-- OD nodes -->
  <circle cx="200" cy="300" r="18" fill="#e94560" opacity="0.7"/>
  <circle cx="500" cy="270" r="28" fill="#e94560" opacity="0.7"/>
  <circle cx="400" cy="220" r="22" fill="#e94560" opacity="0.7"/>
  <circle cx="600" cy="200" r="14" fill="#e94560" opacity="0.7"/>
  <circle cx="300" cy="310" r="10" fill="#e94560" opacity="0.5"/>
  <circle cx="650" cy="220" r="8" fill="#e94560" opacity="0.5"/>
  <!-- Desire lines between nodes -->
  <line x1="200" y1="300" x2="400" y2="220" stroke="#e94560" stroke-width="1.5" opacity="0.4"/>
  <line x1="200" y1="300" x2="500" y2="270" stroke="#e94560" stroke-width="2.5" opacity="0.4"/>
  <line x1="400" y1="220" x2="600" y2="200" stroke="#e94560" stroke-width="2" opacity="0.4"/>
  <line x1="200" y1="300" x2="600" y2="200" stroke="#e94560" stroke-width="1" opacity="0.3"/>
  <line x1="500" y1="270" x2="400" y2="220" stroke="#e94560" stroke-width="2" opacity="0.35"/>
  <line x1="500" y1="270" x2="600" y2="200" stroke="#e94560" stroke-width="1.5" opacity="0.3"/>
  <line x1="300" y1="310" x2="500" y2="270" stroke="#e94560" stroke-width="1" opacity="0.25"/>
  <line x1="300" y1="310" x2="400" y2="220" stroke="#e94560" stroke-width="0.8" opacity="0.2"/>
  <!-- Background map-like grid -->
  <line x1="50" y1="200" x2="750" y2="200" stroke="#0f3460" stroke-width="0.5" opacity="0.3"/>
  <line x1="50" y1="300" x2="750" y2="300" stroke="#0f3460" stroke-width="0.5" opacity="0.3"/>
  <line x1="300" y1="80" x2="300" y2="420" stroke="#0f3460" stroke-width="0.5" opacity="0.3"/>
  <line x1="500" y1="80" x2="500" y2="420" stroke="#0f3460" stroke-width="0.5" opacity="0.3"/>
  <!-- Label -->
  <text x="400" y="470" text-anchor="middle" fill="#888" font-family="sans-serif" font-size="13">Placeholder: OD flow visualisation (replace with video from issue attachment)</text>
</svg>
