name: Sync QMD and IPYNB

on:
  push:
    branches:
      - main
    paths:
      - '**/*.qmd'
      - '**/*.ipynb'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Sync modified files
        run: |
          # Determine commit range for diff
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ] || [ -z "${{ github.event.before }}" ]; then
            FILES=$(git diff-tree --no-commit-id --name-only -r HEAD)
          else
            FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.event.after }})
          fi

          echo "Modified files in this push:"
          echo "$FILES"

          # Arrays to track conversions
          qmd_to_convert=()
          ipynb_to_convert=()

          for file in $FILES; do
            if [[ "$file" == *.qmd ]]; then
              ipynb_file="${file%.qmd}.ipynb"
              if [ -f "$ipynb_file" ]; then
                qmd_to_convert+=("$file")
              fi
            elif [[ "$file" == *.ipynb ]]; then
              qmd_file="${file%.ipynb}.qmd"
              if [ -f "$qmd_file" ]; then
                ipynb_to_convert+=("$file")
              fi
            fi
          done

          CONVERTED=false

          # Convert QMD to IPYNB
          for file in "${qmd_to_convert[@]}"; do
            ipynb_file="${file%.qmd}.ipynb"
            echo "Converting $file -> $ipynb_file"
            quarto convert "$file"
            CONVERTED=true
          done

          # Convert IPYNB to QMD (only if QMD wasn't also modified)
          for file in "${ipynb_to_convert[@]}"; do
            qmd_file="${file%.ipynb}.qmd"
            if [[ ! " ${qmd_to_convert[*]} " =~ " ${qmd_file} " ]]; then
              echo "Converting $file -> $qmd_file"
              quarto convert "$file"
              CONVERTED=true
            else
              echo "Skipping $file because $qmd_file was also modified."
            fi
          done

          # Commit and push changes if any conversions took place
          if [ "$CONVERTED" = true ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            if ! git diff-index --quiet HEAD; then
              git commit -m "Auto-sync QMD and IPYNB [skip ci]"
              git push
            else
              echo "No differences found after conversion."
            fi
          else
            echo "No files needed synchronization."
          fi
